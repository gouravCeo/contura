<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breast Weight Estimator & Calculator | Contoura</title>
<meta name="description" content="Calculate your breast weight to understand back strain. Free breast weight estimator based on bra size by Contoura.">
<meta name="keywords" content="breast weight calculator, bra size weight, breast strain estimator, women health tools, Contoura">
<meta property="og:title" content="Breast Weight Estimator & Calculator | Contoura">
<meta property="og:description" content="Calculate your breast weight to understand back strain. Free breast weight estimator based on bra size by Contoura.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://contoura.online/weight-estimator.html">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="logo" style="text-decoration: none;">Contoura</a>
  <button class="hamburger" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-scroll">
    <span class="drawer-title logo">Contoura</span>
    <a href="index.html" class="nav-btn" style="text-decoration:none;">Home</a>
    <a href="weight-estimator.html" class="nav-btn active" style="text-decoration:none;">Weight</a>
    <a href="size-converter.html" class="nav-btn" style="text-decoration:none;">Convert</a>
    <a href="bra-finder.html" class="nav-btn" style="text-decoration:none;">Bra Finder</a>
    <a href="swimsuit-finder.html" class="nav-btn" style="text-decoration:none;">Swimsuit</a>
    <a href="blog/index.html" class="nav-btn" style="text-decoration:none;">Blog</a>
  </div>
</nav>

<main>
  <div class="tool-layout">
    <div class="tool-sidebar">
      <h1 class="tool-title">Weight Estimator</h1>

      <div class="field">
        <p class="selector-label">Breast Shape</p>
        <div class="visual-grid cols-4" id="shapeGrid">
          <div class="vis-opt selected" data-shape="round" onclick="pickShape(this)">
            <svg viewBox="0 0 44 38" fill="none">
              <circle cx="22" cy="20" r="14" stroke="#1C1410" stroke-width="1.4"/>
              <path d="M10 16 Q22 8 34 16" stroke="#1C1410" stroke-width="1" stroke-dasharray="2 2"/>
            </svg>
            <span class="vis-opt-label">Round</span>
          </div>
          <div class="vis-opt" data-shape="teardrop" onclick="pickShape(this)">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M22 6 Q36 14 36 24 Q36 34 22 34 Q8 34 8 24 Q8 14 22 6Z" stroke="#1C1410" stroke-width="1.4"/>
            </svg>
            <span class="vis-opt-label">Teardrop</span>
          </div>
          <div class="vis-opt" data-shape="conical" onclick="pickShape(this)">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M22 6 L36 32 Q22 36 8 32 Z" stroke="#1C1410" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span class="vis-opt-label">Conical</span>
          </div>
          <div class="vis-opt" data-shape="east-west" onclick="pickShape(this)">
            <svg viewBox="0 0 44 38" fill="none">
              <ellipse cx="12" cy="20" rx="10" ry="13" stroke="#1C1410" stroke-width="1.4"/>
              <ellipse cx="32" cy="20" rx="10" ry="13" stroke="#1C1410" stroke-width="1.4"/>
            </svg>
            <span class="vis-opt-label">East-West</span>
          </div>
          <div class="vis-opt" data-shape="side-set" onclick="pickShape(this)">
            <svg viewBox="0 0 44 38" fill="none">
              <ellipse cx="10" cy="22" rx="9" ry="12" stroke="#1C1410" stroke-width="1.4"/>
              <ellipse cx="34" cy="22" rx="9" ry="12" stroke="#1C1410" stroke-width="1.4"/>
            </svg>
            <span class="vis-opt-label">Side-Set</span>
          </div>
          <div class="vis-opt" data-shape="close-set" onclick="pickShape(this)">
            <svg viewBox="0 0 44 38" fill="none">
              <ellipse cx="16" cy="22" rx="12" ry="13" stroke="#1C1410" stroke-width="1.4"/>
              <ellipse cx="28" cy="22" rx="12" ry="13" stroke="#1C1410" stroke-width="1.4"/>
            </svg>
            <span class="vis-opt-label">Close-Set</span>
          </div>
          <div class="vis-opt" data-shape="slender" onclick="pickShape(this)">
            <svg viewBox="0 0 44 38" fill="none">
              <ellipse cx="22" cy="22" rx="8" ry="14" stroke="#1C1410" stroke-width="1.4"/>
            </svg>
            <span class="vis-opt-label">Slender</span>
          </div>
          <div class="vis-opt" data-shape="tubular" onclick="pickShape(this)">
            <svg viewBox="0 0 44 38" fill="none">
              <rect x="14" y="6" width="16" height="26" rx="8" stroke="#1C1410" stroke-width="1.4"/>
              <ellipse cx="22" cy="33" rx="9" ry="4" stroke="#1C1410" stroke-width="1.2"/>
            </svg>
            <span class="vis-opt-label">Tubular</span>
          </div>
        </div>
      </div>

      <div class="field two-col">
        <div>
          <p class="selector-label">Band</p>
          <select id="wBand">
            <option>28</option><option>30</option><option>32</option><option selected>34</option>
            <option>36</option><option>38</option><option>40</option><option>42</option><option>44</option><option>46</option>
          </select>
        </div>
        <div>
          <p class="selector-label">Cup</p>
          <select id="wCup">
            <option>AA</option><option>A</option><option selected>B</option><option>C</option>
            <option>D</option><option>DD/E</option><option>DDD/F</option><option>G</option>
            <option>H</option><option>I</option><option>J</option><option>K</option>
          </select>
        </div>
      </div>

      <button class="btn-calc" onclick="calcWeight()">Calculate</button>
    </div>

    <div class="tool-main">
      <div id="wResult" class="result-area">
        <div class="result-headline" id="wPerBreast">—</div>
        <div class="result-sub">grams per breast</div>
        <div class="stat-row">
          <div class="stat-box"><span class="n" id="wTotal">—</span><span class="l">Total</span></div>
          <div class="stat-box"><span class="n" id="wLbs">—</span><span class="l">Pounds</span></div>
          <div class="stat-box"><span class="n" id="wStrain">—</span><span class="l">Back Load</span></div>
        </div>
        <div class="tip-box" id="wTip"></div>
      </div>
      <div id="wEmpty" class="empty-state">Select options and calculate</div>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
</body>
</html>
