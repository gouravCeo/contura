<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swimsuit Style Finder | Contoura</title>
<meta name="description" content="Find the most flattering and supportive swimsuits for your bust size and water activities. Personalized swimwear recommendations by Contoura.">
<meta name="keywords" content="swimsuit finder, bikini for my shape, best swimsuit for large bust, women sizing tools, Contoura">
<meta property="og:title" content="Swimsuit Style Finder | Contoura">
<meta property="og:description" content="Find the most flattering and supportive swimsuits for your bust size and water activities. Personalized swimwear recommendations by Contoura.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://contoura.online/swimsuit-finder.html">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="logo" style="text-decoration: none;">Contoura</a>
  <button class="hamburger" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-scroll">
    <span class="drawer-title logo">Contoura</span>
    <a href="index.html" class="nav-btn" style="text-decoration:none;">Home</a>
    <a href="weight-estimator.html" class="nav-btn" style="text-decoration:none;">Weight</a>
    <a href="size-converter.html" class="nav-btn" style="text-decoration:none;">Convert</a>
    <a href="bra-finder.html" class="nav-btn" style="text-decoration:none;">Bra Finder</a>
    <a href="swimsuit-finder.html" class="nav-btn active" style="text-decoration:none;">Swimsuit</a>
    <a href="blog/index.html" class="nav-btn" style="text-decoration:none;">Blog</a>
  </div>
</nav>

<main>
  <div class="tool-layout">
    <div class="tool-sidebar">
      <h1 class="tool-title">Swimsuit Finder</h1>

      <div class="field">
        <p class="selector-label">Cup Size</p>
        <div class="visual-grid cols-2" id="swimCupGrid">
          <div class="vis-opt" data-val="small" onclick="pickOpt(this,'swimCup')">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M8 28 Q12 14 22 16 Q32 14 36 28" stroke="#1C1410" stroke-width="1.4" fill="none"/>
              <path d="M8 28 Q8 32 22 32 Q36 32 36 28" stroke="#1C1410" stroke-width="1.4" fill="none"/>
            </svg>
            <span class="vis-opt-label">AA – A</span>
          </div>
          <div class="vis-opt selected" data-val="medium" onclick="pickOpt(this,'swimCup')">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M6 30 Q10 12 22 14 Q34 12 38 30" stroke="#1C1410" stroke-width="1.4" fill="none"/>
              <path d="M6 30 Q6 36 22 36 Q38 36 38 30" stroke="#1C1410" stroke-width="1.4" fill="none"/>
            </svg>
            <span class="vis-opt-label">B – C</span>
          </div>
          <div class="vis-opt" data-val="large" onclick="pickOpt(this,'swimCup')">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M4 32 Q8 8 22 10 Q36 8 40 32" stroke="#1C1410" stroke-width="1.4" fill="none"/>
              <path d="M4 32 Q4 38 22 38 Q40 38 40 32" stroke="#1C1410" stroke-width="1.4" fill="none"/>
            </svg>
            <span class="vis-opt-label">D – DD</span>
          </div>
          <div class="vis-opt" data-val="xlarge" onclick="pickOpt(this,'swimCup')">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M2 34 Q6 4 22 6 Q38 4 42 34" stroke="#1C1410" stroke-width="1.4" fill="none"/>
              <path d="M2 34 Q2 40 22 40 Q42 40 42 34" stroke="#1C1410" stroke-width="1.4" fill="none"/>
            </svg>
            <span class="vis-opt-label">DDD+</span>
          </div>
        </div>
      </div>

      <div class="field">
        <p class="selector-label">Activity</p>
        <div class="visual-grid cols-2" id="swimActivityGrid">
          <div class="vis-opt selected" data-val="pool" onclick="pickOpt(this,'swimActivity')">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M4 28 Q14 22 22 28 Q30 34 40 28" stroke="#1C1410" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <path d="M4 22 Q14 16 22 22 Q30 28 40 22" stroke="#1C1410" stroke-width="1" fill="none" stroke-linecap="round"/>
              <circle cx="22" cy="13" r="5" stroke="#1C1410" stroke-width="1.4"/>
            </svg>
            <span class="vis-opt-label">Pool</span>
          </div>
          <div class="vis-opt" data-val="beach" onclick="pickOpt(this,'swimActivity')">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M4 32 Q14 24 22 30 Q30 36 40 28" stroke="#1C1410" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <path d="M8 14 Q16 8 30 16" stroke="#1C1410" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <circle cx="32" cy="10" r="6" stroke="#C7604A" stroke-width="1.4"/>
            </svg>
            <span class="vis-opt-label">Beach</span>
          </div>
          <div class="vis-opt" data-val="active" onclick="pickOpt(this,'swimActivity')">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M8 20 Q16 10 24 18 Q32 26 40 16" stroke="#1C1410" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <circle cx="8"  cy="20" r="3" stroke="#1C1410" stroke-width="1.4"/>
              <circle cx="40" cy="16" r="3" stroke="#C7604A" stroke-width="1.4"/>
            </svg>
            <span class="vis-opt-label">Active</span>
          </div>
          <div class="vis-opt" data-val="fashion" onclick="pickOpt(this,'swimActivity')">
            <svg viewBox="0 0 44 38" fill="none">
              <path d="M22 8 L26 18 L38 18 L28 26 L32 38 L22 30 L12 38 L16 26 L6 18 L18 18 Z" stroke="#1C1410" stroke-width="1.4" fill="none"/>
            </svg>
            <span class="vis-opt-label">Fashion</span>
          </div>
        </div>
      </div>

      <button class="btn-calc" onclick="calcSwim()">Find Style</button>
    </div>

    <div class="tool-main">
      <div id="sResult" class="result-area">
        <p class="selector-label" style="margin-bottom:16px">Best swimsuit styles for you</p>
        <div id="sCards"></div>
      </div>
      <div id="sEmpty" class="empty-state">Choose your shape and activity</div>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
</body>
</html>
